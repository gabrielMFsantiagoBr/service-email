quarkus.application.name=service-email
quarkus.http.port=${PORT:8080}

# ---------------------------------------------------------------------------
# Envio de email (SMTP). Tudo vem de variáveis de ambiente: nenhuma credencial
# fica no código. Em dev e em teste o mailer roda em modo "mock" (não envia
# nada, só registra no log). Para enviar de verdade: QUARKUS_MAILER_MOCK=false
# ---------------------------------------------------------------------------
quarkus.mailer.from=${MAIL_FROM:no-reply@example.com}
quarkus.mailer.host=${MAIL_HOST:localhost}
quarkus.mailer.port=${MAIL_PORT:587}
quarkus.mailer.username=${MAIL_USERNAME:}
quarkus.mailer.password=${MAIL_PASSWORD:}
# REQUIRED | OPTIONAL | DISABLED (use DISABLED só em SMTP local, ex.: Mailpit)
quarkus.mailer.start-tls=${MAIL_START_TLS:REQUIRED}

# ---------------------------------------------------------------------------
# Aplicação
# ---------------------------------------------------------------------------
# Nome que aparece nos templates e assuntos (ex.: "Bem-vindo(a) ao <APP_NAME>")
email.app-name=${APP_NAME:Service Email}

# ---------------------------------------------------------------------------
# Página de teste (/demo): cadastro, login, recuperação de senha e suporte.
# Contas ficam só na memória. Ligada por padrão em dev e teste, DESLIGADA em
# produção (DEMO_ENABLED=true para ligar de propósito).
# ---------------------------------------------------------------------------
demo.enabled=${DEMO_ENABLED:false}
%dev.demo.enabled=true
%test.demo.enabled=true
# Endereço público desta aplicação: base do link enviado no email de redefinição
demo.base-url=${APP_BASE_URL:http://localhost:8080}
# Quem recebe as mensagens da aba Suporte (padrão: o próprio remetente MAIL_FROM)
demo.support-to=${SUPPORT_EMAIL:${MAIL_FROM:no-reply@example.com}}
%test.demo.support-to=suporte@example.com
demo.reset-token-ttl-minutes=30
demo.pbkdf2-iterations=600000
%test.demo.pbkdf2-iterations=1000

# Se definida, todas as chamadas a /api/** precisam enviar o header X-API-Key
# com este valor. Vazia = sem autenticação (use só em desenvolvimento).
email.api-key=${EMAIL_API_KEY:}
