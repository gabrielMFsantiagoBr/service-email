<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redefinição de senha</title>
</head>
<body style="margin:0;padding:0;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="max-width:560px;width:100%;background:#ffffff;border-radius:8px;padding:32px;">
          <tr>
            <td>
              <h1 style="margin:0 0 16px;font-size:22px;">Olá, {name}!</h1>
              <p style="margin:0 0 24px;font-size:16px;line-height:1.5;">
                Recebemos um pedido para redefinir a senha da sua conta no <strong>{appName}</strong>.
              </p>
              <p style="margin:0 0 24px;">
                <a href="{resetLink}" style="display:inline-block;background:#2563eb;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-size:16px;">Criar nova senha</a>
              </p>
              <p style="margin:0 0 8px;font-size:14px;line-height:1.5;color:#52606d;">
                Se o botão não funcionar, copie e cole este endereço no navegador:
              </p>
              <p style="margin:0 0 24px;font-size:14px;word-break:break-all;color:#52606d;">{resetLink}</p>
              <p style="margin:0;font-size:14px;line-height:1.5;color:#52606d;">
                Se você não fez esse pedido, ignore este email: sua senha continua a mesma.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
